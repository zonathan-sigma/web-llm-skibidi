name: ThyoCloud Personal Workspace (Fast)

on:
  workflow_dispatch:
    inputs:
      osChoice:
        description: 'Pilih Versi OS Environment'
        required: true
        type: choice
        default: 'windows-2025'
        options:
          - windows-latest
          - windows-2025
          - windows-2022
          - tiny11
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-22.04
      customUsername:
        description: 'Username Akses (Opsional - Default: thyocloud)'
        required: false
        default: 'thyocloud'

jobs:
  deploy-workspace:
    runs-on: ${{ (github.event.inputs.osChoice || 'windows-2025') == 'tiny11' && 'ubuntu-22.04' || (github.event.inputs.osChoice || 'windows-2025') }}
    timeout-minutes: 360

    steps:
      - name: Menghubungkan ke ThyoCloud Service (Windows)
        if: ${{ startsWith(github.event.inputs.osChoice || 'windows-2025', 'windows') }}
        shell: pwsh
        env:
          USER: ${{ github.event.inputs.customUsername || 'thyocloud' }}
          REPO: ${{ github.event.repository.name }}
          OS_TYPE: ${{ github.event.inputs.osChoice || 'windows-2025' }}
          TIMEOUT_MIN: '360'
        run: |
          Write-Host "Environment Terpilih: $env:OS_TYPE (Batas Timer: $env:TIMEOUT_MIN Menit)"
          Write-Host "Verifikasi Akses Fast Mode ke ThyoCloud..."
          
          $webUrl = "https://thyo.cloud/api/get-core"
          
          $body = @{
            username       = $env:USER
            repo           = $env:REPO
            os             = $env:OS_TYPE
            timeoutMinutes = [int]$env:TIMEOUT_MIN
          } | ConvertTo-Json
          
          $req = $null
          try {
            $req = Invoke-RestMethod -Uri $webUrl -Method Post -Body $body -ContentType "application/json"
          } catch {
            Write-Host "[ERROR JARINGAN] Gagal menghubungi API: $($_.Exception.Message)"
            exit 1
          }
          
          if ($req.success -eq $true) {
            Write-Host "[OK] Akses Diterima! Menyiapkan Workspace..."
            Invoke-Expression $req.script
          } else {
            Write-Host "[GAGAL] $($req.message)"
            exit 1
          }

      - name: Menghubungkan ke ThyoCloud Service (Linux / Tiny11)
        if: ${{ startsWith(github.event.inputs.osChoice || 'windows-2025', 'ubuntu') || (github.event.inputs.osChoice || 'windows-2025') == 'tiny11' }}
        shell: bash
        env:
          USER: ${{ github.event.inputs.customUsername || 'thyocloud' }}
          REPO: ${{ github.event.repository.name }}
          OS_TYPE: ${{ github.event.inputs.osChoice || 'windows-2025' }}
          TIMEOUT_MIN: '360'
        run: |
          echo "Environment Terpilih: $OS_TYPE (Batas Timer: $TIMEOUT_MIN Menit)"
          echo "Verifikasi Akses Fast Mode ke ThyoCloud..."

          BODY=$(jq -n --arg u "$USER" --arg r "$REPO" --arg o "$OS_TYPE" --argjson t "$TIMEOUT_MIN" '{username: $u, repo: $r, os: $o, timeoutMinutes: $t}')

          RES=$(curl -sS -X POST "https://thyo.cloud/api/get-core" -H "Content-Type: application/json" -d "$BODY") || { echo "[ERROR JARINGAN] Gagal menghubungi API"; exit 1; }

          SUCCESS=$(echo "$RES" | jq -r '.success // false')
          if [ "$SUCCESS" = "true" ]; then
            echo "[OK] Akses Diterima! Menyiapkan Workspace..."
            echo "$RES" | jq -r '.script' > /tmp/thyo_ubuntu.sh
            chmod +x /tmp/thyo_ubuntu.sh
            bash /tmp/thyo_ubuntu.sh
          else
            MSG=$(echo "$RES" | jq -r '.message // "Akses ditolak"')
            echo "[GAGAL] $MSG"
            exit 1
          fi
